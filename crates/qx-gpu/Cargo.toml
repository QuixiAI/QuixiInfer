[package]
name = "qx-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burn-cuda = "0.22.1"
burn-cubecl = { version = "0.22.1", features = ["template"] }
burn-tensor = "0.22.1"
cubecl = { version = "0.11", features = ["cuda", "cuda-cpp"] }
cubecl-runtime = "0.11.3"
cudarc = { workspace = true }
bytemuck = "1"
anyhow = { workspace = true }
half = { workspace = true }

[dev-dependencies]
memmap2 = { workspace = true }
qx-cpu = { path = "../qx-cpu" }

# GPU tests run in one process with a plain main: qx_gpu::init() must run before any thread starts.
[[test]]
name = "gpu"
harness = false
