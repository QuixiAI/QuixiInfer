[package]
name = "qx-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quixiinfer"
path = "src/main.rs"

[dependencies]
libc = "0.2"
qx-engine = { path = "../qx-engine" }
qx-gpu = { path = "../qx-gpu" }
qx-pack = { path = "../qx-pack" }
qx-tok = { path = "../qx-tok" }
anyhow = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1.19"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3.0.3", features = ["loop_controls", "builtins", "json", "serde"] }
minijinja-contrib = { version = "3.0.3", features = ["pycompat"] }
llguidance = "1.9.1"
