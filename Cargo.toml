[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "cuda"] }
burn-cuda = "0.22.1"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13010", "dynamic-loading"] }
half = "2.7.1"
memmap2 = "0.9.12"
anyhow = "1"

[profile.release]
debug = 1
codegen-units = 16

# a patched copy of cubecl-cuda 0.11.3: the launch metadata cache's capacity from QX_INFO_CACHE_ENTRIES (third_party/cubecl-cuda,
# one change in src/compute/stream.rs; see perf/optimization_status.md 2026-11-07, "launch-bound")
[patch.crates-io]
cubecl-cuda = { path = "third_party/cubecl-cuda" }
